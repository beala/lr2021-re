; LR2021 test firmware. Standalone: Arduino (Adafruit nRF52 core) + RadioLib, nothing else.
;
; Programs (src/<name>/):
;   console        raw chip access, IQ capture/streaming, hardware LoRa RX/TX (used by tools/)
;   rate_bench     bit-rate bench, raw IQ TX, reserved-code experiments (docs/rate-bench.md)
;   dualband_bench 908 MHz / 2478 MHz CAD scan bench (docs/dualband-bench.md)
; Boards:
;   xiao    Seeed XIAO nRF52840 + Seeed Wio-LR2021
;   nicerf  RAK3401 + RAK19007 + NiceRF LoRa2021F33-2G4 carrier (needs a battery to transmit)
;
;   pio run -e xiao_console -t upload --upload-port /dev/ttyACM0

[platformio]
default_envs = xiao_console, nicerf_console

[env]
platform = nordicnrf52
framework = arduino
board_build.variants_dir = variants
monitor_speed = 115200
upload_protocol = nrfutil
lib_deps =
  SPI
  ; RadioLib 7.7.1 + LR2021 force/auto LDRO (#1820): the version all results were taken with
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
build_flags =
  -w
  -D NDEBUG
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1

[xiao]
board = xiao_wio_lr2021
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${env.build_flags} -D BOARD_XIAO_WIO_LR2021
  ; I2C on the two free header pins (the core needs Wire pins even if nothing is attached)
  -D PIN_WIRE_SDA=D0
  -D PIN_WIRE_SCL=D10

[nicerf]
board = rak3401_nicerf_lr2021
build_flags = ${env.build_flags} -D BOARD_RAK3401_NICERF_LR2021

[env:xiao_console]
extends = xiao
build_src_filter = +<console/>

[env:nicerf_console]
extends = nicerf
build_src_filter = +<console/>

[env:xiao_rate_bench]
extends = xiao
build_src_filter = +<rate_bench/>

[env:nicerf_rate_bench]
extends = nicerf
build_src_filter = +<rate_bench/>

[env:xiao_dualband_bench]
extends = xiao
build_src_filter = +<dualband_bench/>

[env:nicerf_dualband_bench]
extends = nicerf
build_src_filter = +<dualband_bench/>
